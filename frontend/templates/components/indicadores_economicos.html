<section
    style="margin: 0.35rem 0 0.7rem; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; padding:0.55rem 0.7rem;"
    data-indicadores-component
    data-endpoint="/api/integraciones/indicadores/"
>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.45rem; flex-wrap:wrap; margin-bottom:0.3rem;">
        <h2 style="margin:0; font-size:0.95rem; line-height:1.15;">Indicadores economicos</h2>
        <button type="button" class="btn btn--secondary" style="padding:0.25rem 0.55rem; font-size:0.8rem; line-height:1.1;" data-actualizar-indicadores>
            Actualizar
        </button>
    </div>

    <p data-indicadores-loading style="margin:0.15rem 0; font-size:0.84rem;">Cargando indicadores economicos...</p>
    <p data-indicadores-error style="display:none; margin:0.15rem 0; color:#b91c1c; font-size:0.84rem;">
        No fue posible cargar los indicadores en este momento.
    </p>

    <div data-indicadores-body style="display:none;">
        <div style="display:flex; flex-wrap:wrap; gap:0.2rem 0.65rem; margin:0.05rem 0 0.25rem; font-size:0.86rem; line-height:1.2;">
            <span><strong>UF:</strong> <span data-valor-uf>-</span></span>
            <span><strong>Dolar:</strong> <span data-valor-dolar>-</span></span>
            <span><strong>Euro:</strong> <span data-valor-euro>-</span></span>
            <span><strong>UTM:</strong> <span data-valor-utm>-</span></span>
        </div>

        <p style="margin:0; color:#475569; font-size:0.74rem; line-height:1.25;">
            <strong>Fuente:</strong> <span data-fuente>mindicador.cl</span>
            <span aria-hidden="true"> · </span>
            <strong>Consulta:</strong> <span data-fecha-consulta>-</span>
        </p>
        <p style="margin:0.12rem 0 0; color:#475569; font-size:0.72rem; line-height:1.25;">
            Valores informativos. No modifican precios ni pagos del sistema.
        </p>
    </div>
</section>
