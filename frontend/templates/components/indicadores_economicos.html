<section
    class="indicadores-widget"
    data-indicadores-component
    data-endpoint="/api/integraciones/indicadores/"
>
    <div class="indicadores-widget__header">
        <h2 class="indicadores-widget__title">Indicadores economicos</h2>
        <button type="button" class="btn btn--secondary indicadores-widget__refresh-btn" data-actualizar-indicadores>
            Actualizar
        </button>
    </div>

    <p data-indicadores-loading class="indicadores-widget__meta">Cargando indicadores economicos...</p>
    <p data-indicadores-error class="indicadores-widget__meta">
        No fue posible cargar los indicadores en este momento.
    </p>

    <div data-indicadores-body>
        <div class="indicadores-widget__values">
            <span><strong>UF:</strong> <span data-valor-uf>-</span></span>
            <span><strong>Dolar:</strong> <span data-valor-dolar>-</span></span>
            <span><strong>Euro:</strong> <span data-valor-euro>-</span></span>
            <span><strong>UTM:</strong> <span data-valor-utm>-</span></span>
        </div>

        <p class="indicadores-widget__meta">
            <strong>Fuente:</strong> <span data-fuente>mindicador.cl</span>
            <span aria-hidden="true"> · </span>
            <strong>Consulta:</strong> <span data-fecha-consulta>-</span>
        </p>
        <p class="indicadores-widget__disclaimer">
            Valores informativos. No modifican precios ni pagos del sistema.
        </p>
    </div>
</section>
