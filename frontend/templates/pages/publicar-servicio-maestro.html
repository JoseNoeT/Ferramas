{% extends "base/base.html" %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1 class="auth-card__title">Publicar servicio Maestro/PYME</h1>
        <p class="auth-card__subtitle">
            Completa esta ficha inicial para publicar tu servicio de forma demostrativa.
        </p>

        {% if messages %}
            {% for message in messages %}
                <p class="auth-card__alert auth-card__alert--{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form class="auth-form" method="post" action="{% url 'publicar_servicio_maestro' %}" novalidate>
            {% csrf_token %}

            <div class="auth-form__field">
                <label for="id_titulo">Titulo del servicio</label>
                <input id="id_titulo" name="titulo" type="text" required>
            </div>

            <div class="auth-form__field">
                <label for="id_rubro">Rubro</label>
                <input id="id_rubro" name="rubro" type="text" required>
            </div>

            <div class="auth-form__field">
                <label for="id_descripcion">Descripcion</label>
                <textarea id="id_descripcion" name="descripcion" rows="4" required></textarea>
            </div>

            <div class="auth-form__field">
                <label for="id_zona">Comuna o zona de atencion</label>
                <input id="id_zona" name="zona" type="text" required>
            </div>

            <div class="auth-form__field">
                <label for="id_telefono">Telefono de contacto</label>
                <input id="id_telefono" name="telefono" type="tel" required>
            </div>

            <div class="auth-form__field">
                <label for="id_email">Email</label>
                <input id="id_email" name="email" type="email" required>
            </div>

            <div class="auth-form__field">
                <label for="id_precio">Precio referencial (opcional)</label>
                <input id="id_precio" name="precio" type="text">
            </div>

            <button class="auth-form__submit" type="submit">Publicar servicio</button>
        </form>
    </div>
</section>
{% endblock %}
